name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Host g++ only (tests/native + cpp/src/sim); runs before emsdk is installed on purpose.
      - name: Simulation tests (native)
        run: npm run test:sim

      # emsdk pin: keep equal to the version in cpp/README.md ("Toolchain pin"). Bump both together, then replay a
      # native trace against the wasm build (see there): a compiler bump can change wasm float codegen.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.13
          actions-cache-folder: emsdk-cache

      - run: npm ci

      - name: Build WASM (release flags)
        run: npm run build:wasm

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Unit tests
        run: npm run test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
